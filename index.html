<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky kid tab bar, one column of chunky "sticker" cards per kid, parent area behind a code pad. */
:root{
  --bg:#eef3ff; --bg2:#e3ebff; --surface:#ffffff; --surface2:#f6f8ff; --ink:#1c1f45; --muted:#5d6390; --line:#d9e0f7;
  --sun:#ffb400; --sun-ink:#5a3d00; --good:#13a05a; --good-bg:#dcf7e8; --warn:#c77700; --warn-bg:#fff1d6; --bad:#d92d55; --bad-bg:#ffe3ea;
  --elijah:#2563eb; --declan:#e8590c; --adeline:#e0307a; --conley:#7c3aed;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px; --shadow:0 3px 0 rgba(28,31,69,.08),0 8px 24px rgba(28,31,69,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11132b; --bg2:#171a3a; --surface:#1d2147; --surface2:#242958; --ink:#f2f3ff; --muted:#aab0dd; --line:#343a72;
  --sun:#ffc533; --sun-ink:#3b2900; --good:#3ddc8a; --good-bg:#123c2b; --warn:#ffb648; --warn-bg:#3d2c0c; --bad:#ff6b8b; --bad-bg:#4a1626;
  --elijah:#5b8cff; --declan:#ff8a3d; --adeline:#ff5fa2; --conley:#a57bff; --shadow:0 3px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11132b; --bg2:#171a3a; --surface:#1d2147; --surface2:#242958; --ink:#f2f3ff; --muted:#aab0dd; --line:#343a72;
  --sun:#ffc533; --sun-ink:#3b2900; --good:#3ddc8a; --good-bg:#123c2b; --warn:#ffb648; --warn-bg:#3d2c0c; --bad:#ff6b8b; --bad-bg:#4a1626;
  --elijah:#5b8cff; --declan:#ff8a3d; --adeline:#ff5fa2; --conley:#a57bff; --shadow:0 3px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* tab bar */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.tabs-in{max-width:1400px;margin:0 auto;display:flex;gap:8px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;font-weight:800;font-size:.8rem;color:var(--muted)}
.tab .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.25rem;background:var(--k)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--ink)}
.tab[aria-selected="true"] .av{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--k)}
.tab.lock .av{background:var(--ink);color:var(--surface)}
.tab .badge{font-size:.68rem;line-height:1;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:2px 6px;margin-top:-10px;position:relative;z-index:1}

/* top tabs: one row, avatar beside name (landscape) */
.tab{flex:1 1 0;flex-direction:row!important;justify-content:center;gap:10px!important;min-height:56px!important;font-size:1rem!important;padding:6px 10px!important;position:relative}
.tab .badge{position:absolute;top:4px;left:calc(50% - 4px);margin:0}
.tab.caltab .av{background:var(--sun);color:var(--sun-ink)}
.tab .av{flex:none}
.tab .av svg{width:20px;height:20px}
@media (max-width:760px){.tab{flex-direction:column!important;gap:2px!important;font-size:.72rem!important;padding:4px 2px!important}.tab .badge{left:auto;right:4px}}

/* kid page: sticky sidebar | main | daily rail */
:root{--tabs-h:74px}
.kid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr) 320px;grid-template-areas:"side main rail";gap:18px;align-items:start;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{grid-area:side;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabs-h) + 14px);display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.side .who{background:var(--k);color:#fff;padding:16px;display:flex;flex-direction:column;gap:12px}
.side .who h1{font-size:1.9rem;font-weight:800}
.side .who .sub{font-weight:700;opacity:.92}
.side .who .rowx{display:flex;align-items:center;gap:12px}
.side .ring{width:84px;height:84px;flex:none}
.side .ring .num{font-size:1.3rem}
.side .stat2{display:flex;flex-direction:column;gap:6px}
.side .stat2 span{font-weight:800}
.side .stat2 .m{background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:2px 10px;align-self:flex-start}
.sidenav{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.snav{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:12px 14px;min-height:60px;font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--surface2);color:var(--ink);text-align:left}
.snav svg{width:26px;height:26px;flex:none}
.snav[aria-current="page"]{background:var(--k);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--k) 55%,#000)}
.snav .cnt{margin-left:auto;font-family:var(--body);font-size:.85rem;background:var(--bad);color:#fff;border-radius:99px;min-width:28px;padding:2px 8px;text-align:center}
.snav .cnt.ok{background:var(--good)}
.side .today-ev{padding:0 12px 14px}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evlist li{background:var(--surface2);border-left:5px solid var(--ev,var(--ink));border-radius:10px;padding:6px 10px;font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.evlist li small{display:block;color:var(--muted);font-weight:800}
.main{grid-area:main;display:flex;flex-direction:column;gap:16px;min-width:0}
.rail{grid-area:rail;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabs-h) + 14px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - var(--tabs-h) - 30px);overflow:auto;border-radius:var(--r)}
.page-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:2.1rem}
.page-h .meta{color:var(--muted);font-weight:800}
.choregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
@media (max-width:1180px){.kid{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"side rail" "side main"}.rail{position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:760px){.kid{grid-template-columns:1fr;grid-template-areas:"side" "rail" "main"}.side{position:static}.sidenav{flex-direction:row}.snav{flex:1;font-size:1.05rem}.rail{grid-template-columns:1fr}}

/* calendar */
.calwrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:980px){.calwrap{grid-template-columns:1fr}}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calbar h2{font-size:2rem;flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-weight:800;color:var(--muted);text-align:center;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.cal .cell{background:var(--surface);border-radius:12px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);min-width:0}
.cal .cell.out{opacity:.45}
.cal .cell.today{outline:3px solid var(--sun)}
.cal .dn{font-family:var(--display);font-weight:800;font-size:1.05rem}
.cal .ev{font-size:.74rem;font-weight:800;border-radius:6px;padding:1px 5px;background:color-mix(in srgb,var(--ev) 22%,var(--surface));border-left:4px solid var(--ev);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .due{font-size:.7rem;font-weight:800;color:var(--muted)}
.gcal{width:100%;height:640px;border:0;border-radius:var(--r);background:#fff;margin-top:16px}

/* hero */
.hero{background:var(--k);color:#fff;border-radius:26px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800}
.hero .sub{opacity:.92;font-weight:700}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:800;text-align:center;line-height:1}
.ring .num small{display:block;font-size:.62rem;font-family:var(--body);opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-weight:800;font-size:.9rem}
.chip.money{background:var(--sun);color:var(--sun-ink)}

/* daily cards */
.daily{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.daily{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.dcard h3{font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--k)}
.verse{font-size:1.08rem;font-weight:700}
.ref{color:var(--muted);font-weight:800;margin-top:6px}
.move-steps{margin:6px 0 0;padding-left:20px}
.move-steps li{margin:2px 0}
.watch{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--bad-bg);color:var(--ink);font-weight:800;text-decoration:none;min-height:48px}
.watch .play{width:30px;height:30px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
.watch small{display:block;font-weight:700;color:var(--muted);font-size:.78rem}
.tip{font-size:.85rem;color:var(--muted);margin-top:8px}
.did{margin-top:10px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:color-mix(in srgb,var(--k) 15%,var(--surface));color:var(--ink);min-height:48px;width:100%}
.did.on{background:var(--good);color:#fff}

/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:1.6rem}
.sec-h .meta{color:var(--muted);font-weight:800}
.day{display:flex;flex-direction:column;gap:8px}
.day-h{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:6px}
.day-h .today{background:var(--k);color:#fff;border-radius:99px;font-size:.75rem;padding:1px 10px;font-family:var(--body);font-weight:800}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left;width:100%}
.item.done{background:var(--good-bg)}
.item.late{border-color:var(--bad)}
.box{width:44px;height:44px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;background:var(--surface2);flex:none;transition:transform .15s}
.item.done .box{background:var(--good);border-color:var(--good)}
.box svg{width:26px;height:26px;opacity:0}
.item.done .box svg{opacity:1}
.item:active .box{transform:scale(.9)}
.it-main{min-width:0}
.subj{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--k);margin-right:6px}
.it-title{font-weight:800;font-size:1.02rem;overflow-wrap:anywhere}
.item.done .it-title{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.it-detail{color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.tag.graded{background:var(--sun);color:var(--sun-ink)}
.tag.late{background:var(--bad);color:#fff}
.tag.time{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);font-weight:700;padding:14px;border:2px dashed var(--line);border-radius:16px;text-align:center}
details.more>summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted);padding:6px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";}
details.more[open]>summary::before{content:"▾ ";}

/* chores */
.chore{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pay{font-family:var(--display);font-weight:800;font-size:1.25rem;background:var(--sun);color:var(--sun-ink);border-radius:14px;min-width:54px;text-align:center;padding:6px 8px}
.pay.free{background:var(--surface2);color:var(--muted);font-size:.85rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.slot{width:48px;height:48px;border-radius:14px;border:3px dashed var(--line);background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem}
.slot.mine{border-style:solid;border-color:var(--good);background:var(--good);color:#fff}
.slot.other{border-style:solid;border-color:var(--line);background:var(--surface2);color:var(--muted);cursor:not-allowed}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:99px;font-weight:800;z-index:70;max-width:calc(100% - 32px);text-align:center}

.pad-wrap{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:50;padding:20px}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:62px;border-radius:18px;border:0;background:var(--surface2);font-family:var(--display);font-size:1.6rem;font-weight:800}

function toggleGraded(itemId,kid){
  if(!db||S.readOnly)return;
  const it=allItems().find(x=>x.id===itemId);if(!it)return;
  const id=sId(it,kid);const cur=S.done[id];const ref=db.doc("done/"+id);const label=`${it.subject}: ${it.title}`;
  if(!cur){toast(`${KID[kid].name} hasn't checked this off yet.`);return}
  const g=!cur.graded;
  write(()=>ref.update({graded:g,gradedAt:g?new Date().toISOString():null}));
  logEvent(kid,g?"graded":"ungraded",label,"parent");
}
function toggleSlot(choreId,slot,kid){
  if(!db||S.readOnly)return;
  const c=S.chores.find(x=>x.id===choreId);if(!c)return;
  const {thisW}=dates();const id=cId(c,thisW,slot,kid);const cur=S.done[id];const ref=db.doc("done/"+id);
  if(cur){
    if(cur.kid!==kid){toast(`${KID[cur.kid]?.name||"Someone"} already did this one.`);return}
    write(()=>ref.delete());logEvent(kid,"unchecked",`Chore: ${c.name}`,"kid");
  }else{
    write(()=>ref.set({kind:"chore",itemId:c.id,kid,title:c.name,pay:Number(c.pay)||0,week:thisW,slot,doneAt:new Date().toISOString()}));
    logEvent(kid,"completed",`Chore: ${c.name}${c.pay?` (${money(c.pay)})`:""}`,"kid");
    celebrate(kid,"chore",c);
  }
}
function removeDone(id){
  const cur=S.done[id];if(!cur||!db)return;
  write(()=>db.doc("done/"+id).delete());
  logEvent(cur.kid,"check removed",cur.kind==="chore"?`Chore: ${cur.title}`:cur.title,"parent");
}
function toggleWorkout(kid,title){
  if(!db||S.readOnly)return;
  const {today,thisW}=dates();const id=wId(kid,today);const ref=db.doc("done/"+id);
  if(S.done[id]){write(()=>ref.delete());logEvent(kid,"unchecked",`Daily ${KID[kid].trainAge?"workout":"move"}: ${title}`,"kid");}
  else{write(()=>ref.set({kind:"workout",kid,title,date:today,week:thisW,doneAt:new Date().toISOString()}));
    logEvent(kid,"completed",`Daily ${KID[kid].trainAge?"workout":"move"}: ${title}`,"kid");celebrate(kid,"workout",{title});}
}
function saveChores(next,logText){
  if(!db)return;S.chores=next;render();
  write(()=>db.doc("config/chores").set({chores:next}));
  if(logText)logEvent("","chores edited",logText,"parent");
}
function addAssignment(item){
  const week=mondayOf(item.due);const ref=db.doc("weeks/"+week);
  write(async()=>{const s=await ref.get();const items=s.exists?[...(s.data().items||[])]:[];items.push(item);
    await ref.set({week,label:"Week of "+pd(week).toLocaleDateString("en-US",{month:"long",day:"numeric"}),items});});
  logEvent(item.kids.length===1?item.kids[0]:"","assignment added",`${item.subject}: ${item.title} (due ${fmtShort(item.due)}) for ${item.kids.map(k=>KID[k].name).join(", ")}`,"parent");
}
function deleteAssignment(itemId){
  const it=allItems().find(x=>x.id===itemId);if(!it)return;const week=mondayOf(it.due);
  const wk=Object.values(S.weeks).find(w=>(w.items||[]).some(x=>x.id===itemId));const ref=db.doc("weeks/"+(wk?wk.week:week));
  write(async()=>{const s=await ref.get();if(!s.exists)return;const d=s.data();await ref.set({...d,items:(d.items||[]).filter(x=>x.id!==itemId)});});
  logEvent("","assignment removed",`${it.subject}: ${it.title}`,"parent");
}

const CHEERS=["Awesome job","Way to go","You did it","High five","Crushed it","Super star","Nailed it","Look at you go"];
const BIGS=["🎉","⭐","🏆","🚀","🌟","💪","🥳","🎊"];
function celebrate(kid,kind,obj){
  const k=KID[kid];const n=Math.floor(Math.random()*CHEERS.length);
  let msg=kind==="chore"?(obj.pay?`+${money(obj.pay)} earned!`:"Thanks for helping the family!"):kind==="workout"?"Strong body, strong heart!":"One more thing done!";
  // All of today's school done?
  const {today}=dates();
  if(kind==="school"){
    const todays=allItems().filter(i=>i.kids.includes(kid)&&i.due===today);
    const left=todays.filter(i=>!S.done[sId(i,kid)]&&i.id!==obj.id).length;
    if(todays.length&&left===0){showPop(kid,"🏆",`All done for today, ${k.name}!`,"Every school item due today is checked off.");confetti(kid,260);return}
  }
  showPop(kid,BIGS[n%BIGS.length],`${CHEERS[n]}, ${k.name}!`,msg);confetti(kid,120);
}
let popT=null;
function showPop(kid,big,title,sub){
  const L=$("#layer");L.innerHTML=`<div class="pop" style="--k:var(--${kid})"><div class="pop-card" role="status"><div class="big">${big}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div></div>`;

let toastT=null;
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.querySelectorAll(".toast").forEach(x=>x.remove());document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200)}
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(kid,n){
  if(reduce)return;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const kc=getComputedStyle(document.documentElement).getPropertyValue("--"+kid).trim()||"#2563eb";
  const cols=[kc,"#ffb400","#13a05a","#e0307a","#2563eb","#ff8a3d","#7c3aed"];
  for(let i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-8)*devicePixelRatio,r:(4+Math.random()*6)*devicePixelRatio,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life<160&&p.y<cv.height+40);
  for(const p of parts){p.life++;p.vy+=.55*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();}
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function monthAdd(m,n){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)}
function calView(){
  const {today}=dates();const m=S.calMonth||today.slice(0,7);
  const start=mondayOf(m+"-01");const evs=S.calendar.events||[];
  const byDate={};evs.forEach(e=>(byDate[e.date]=byDate[e.date]||[]).push(e));

  const up=evs.filter(e=>e.date>=today&&e.date<=addDays(today,30)).sort((a,b)=>(a.date+(a.time||""))<(b.date+(b.time||""))?-1:1);

}
function normEmbed(raw){
  let v=(raw||"").trim();if(!v)return "";
  const m=v.match(/src=["']([^"']+)["']/);if(m)v=m[1];
  v=v.replace(/&amp;/g,"&");
  if(/^[^\s/@]+@[^\s/@]+$/.test(v))return "https://calendar.google.com/calendar/embed?src="+encodeURIComponent(v)+"&ctz="+encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Chicago");
  if(!/^https:\/\/(calendar\.google\.com|www\.google\.com\/calendar)\//.test(v))return null;
  return v;
}

function choreRow(c,kid,week){

    const cls=d?(d.kid===kid?"mine":"other"):"";const lbl=d?(KID[d.kid]?.init||"?"):"";
    slots.push(`<button class="slot ${cls}" data-act="slot" data-id="${esc(c.id)}" data-slot="${i}" data-kid="${kid}" aria-label="${esc(c.name)} time ${i+1}${d?`, done by ${esc(KID[d.kid]?.name||"")}`:""}" ${cls==="other"?'aria-disabled="true"':""}>${d?(d.kid===kid?"✓":lbl):""}</button>`)}
  const shared=c.each?[]:(c.kids||[]).filter(x=>x!==kid).map(x=>KID[x]?.name).filter(Boolean);
  const dd=dayDate(c,week);const today=dates().today;const allDone=slots.length&&[...Array(Number(c.freq)||1).keys()].every(i=>S.done[cId(c,week,i,kid)]);

  const tag=dd&&!allDone?(dd===today?`<span class="tag" style="background:var(--k);color:#fff">Today</span>`:dd<today?`<span class="tag late">Missed ${esc(DAYS[c.day])}</span>`:""):"";
  return `<div class="chore${dd===today&&!allDone?" today":""}"><div class="pay${c.pay?"":" free"}">${c.pay?money(c.pay):(c.day?DAYS[c.day].slice(0,3):"Daily")}</div><div style="min-width:0"><div class="it-title">${esc(c.name)} ${tag}</div>

function codePad(){
  let v="";
  const L=$("#layer");
  const draw=(shake)=>{L.innerHTML=`<div class="pad-wrap"><div class="pad" role="dialog" aria-label="Parent code"><h2>Parents only</h2><p style="margin:4px 0 0;color:var(--muted);font-weight:700">Enter the parent code</p>
    <div class="dots${shake?" shake":""}">${[0,1,2,3].map(i=>`<span class="${i<v.length?"f":""}"></span>`).join("")}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="x" data-k="cancel">Cancel</button><button data-k="0">0</button><button class="x" data-k="del">Delete</button></div></div></div>`;
    L.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));};
  const press=k=>{
    if(k==="cancel"){L.innerHTML="";document.removeEventListener("keydown",kd);return}
    if(k==="del"){v=v.slice(0,-1);draw();return}
    v+=k;
    if(v.length===4){if(v===PARENT_CODE){L.innerHTML="";document.removeEventListener("keydown",kd);S.parent=true;render();scrollTo(0,0)}else{v="";draw(true)}return}
    draw();};
  const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Escape")press("cancel")};
  document.addEventListener("keydown",kd);draw();
}

let pending=false;
function render(){

  pending=false;renderTabs();
  $("#app").outerHTML=`<main id="app">${S.parent?parentView():S.cal?calView():kidView(S.tab)}</main>`;

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,kid=b.dataset.kid;
  switch(a){
    case "tab":S.parent=false;S.cal=false;S.tab=kid;try{localStorage.setItem("fhq-tab",kid)}catch(_){}render();scrollTo(0,0);break;
    case "parent":if(!S.parent)codePad();break;
    case "calendar":S.parent=false;S.cal=true;render();scrollTo(0,0);break;
    case "sec":S.section=id;try{localStorage.setItem("fhq-sec",id)}catch(_){}render();scrollTo(0,0);break;
    case "calprev":S.calMonth=monthAdd(S.calMonth||dates().today.slice(0,7),-1);render();break;
    case "calnext":S.calMonth=monthAdd(S.calMonth||dates().today.slice(0,7),1);render();break;
    case "caltoday":S.calMonth=null;render();break;
    case "calsave":{const v=normEmbed($("#cal-embed").value);if(v===null){toast("That doesn't look like a Google Calendar link, embed code, or Calendar ID.");break}
      saveCalendar({...S.calendar,embed:v},v?"Linked a Google Calendar":"Removed the Google Calendar link");toast(v?"Google Calendar linked.":"Link removed.");break}
    case "calclear":saveCalendar({...S.calendar,embed:""},"Removed the Google Calendar link");break;
    case "evdelask":S.confirm="e:"+id;render();break;
    case "evdel":{const e=(S.calendar.events||[]).find(x=>x.id===id);S.confirm=null;saveCalendar({...S.calendar,events:(S.calendar.events||[]).filter(x=>x.id!==id)},`Removed event: ${e?e.title:id}`);break}
    case "lock":S.parent=false;S.cal=false;render();break;
    case "school":toggleSchool(id,kid,false);break;
    case "slot":toggleSlot(id,Number(b.dataset.slot),kid);break;
    case "workout":toggleWorkout(kid,b.dataset.title);break;
    case "ptab":S.ptab=id;S.confirm=null;render();break;
    case "pkid":S.pkid=id;render();break;
    case "grade":toggleGraded(id,kid);break;
    case "pschool":toggleSchool(id,kid,true);break;
    case "rmdone":removeDone(id);break;
    case "ckid":{const next=S.chores.map(c=>c.id!==id?c:{...c,kids:(c.kids||[]).includes(kid)?c.kids.filter(x=>x!==kid):[...(c.kids||[]),kid]});
      const c=next.find(x=>x.id===id);saveChores(next,`${c.name}: now ${c.kids.map(k=>KID[k].name).join(", ")||"nobody"}`);break}
    case "cdelask":S.confirm="c:"+id;render();break;
    case "cdel":{const c=S.chores.find(x=>x.id===id);S.confirm=null;saveChores(S.chores.filter(x=>x.id!==id),`Removed chore: ${c?c.name:id}`);break}
    case "cadd":{const n={id:"x"+Date.now().toString(36),name:"New chore",note:"",pay:1,freq:1,kids:[]};saveChores([...S.chores,n],"Added a new chore");
      setTimeout(()=>{const el=document.getElementById("cn-"+n.id);if(el){el.scrollIntoView({block:"center"});el.select()}},50);break}
    case "akid":b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");break;
    case "adelask":S.confirm="a:"+id;render();break;
    case "adel":S.confirm=null;deleteAssignment(id);break;
  }
});
document.addEventListener("change",e=>{

  try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){}
  if(!data)data=JSON.parse(JSON.stringify(seed));
  const subs=new Set();const fire=()=>subs.forEach(f=>f());
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){}fire()};
  addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){try{data=JSON.parse(e.newValue);fire()}catch(_){}}});
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snap=p=>{const d=data[p];return{id:p.split("/").pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const docRef=p=>({id:p.split("/").pop(),path:p,get:async()=>snap(p),
    set:async v=>{data[p]=clone(v);save()},update:async v=>{if(!data[p])throw{code:"invalid_argument"};data[p]={...data[p],...clone(v)};save()},
    delete:async()=>{delete data[p];save()},onSnapshot:n=>{const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  const query=(col,fl,ob,lim)=>{const q={
    where:(f,op,v)=>query(col,[...fl,[f,op,v]],ob,lim),orderBy:(f,d)=>query(col,fl,[f,d||"asc"],lim),limit:n=>query(col,fl,ob,n),
    docs(){const depth=col.split("/").length+1;let ds=Object.keys(data).filter(k=>k.startsWith(col+"/")&&k.split("/").length===depth).sort().map(snap);
      for(const[f,op,v]of fl)ds=ds.filter(d=>{const x=d.data()[f];return op==="in"?v.includes(x):op==="=="?x===v:true});
      if(ob)ds.sort((a,b)=>{const x=a.data()[ob[0]],y=b.data()[ob[0]];return(x<y?-1:x>y?1:0)*(ob[1]==="desc"?-1:1)});
      return lim?ds.slice(0,lim):ds},
    get:async()=>{const docs=q.docs();return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}},
    onSnapshot:n=>{const f=()=>{const docs=q.docs();n({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}};return q};
  return{doc:docRef,collection:col=>Object.assign(query(col,[],null,0),{path:col,doc:id=>docRef(col+"/"+(id||Math.random().toString(36).slice(2)))})};
}
function subscribe(){
  const slow=setTimeout(()=>{if(!(S.got.weeks&&S.got.chores)){S.dbState="slow";render()}},10000);
  const ok=()=>{if(S.got.weeks&&S.got.chores){clearTimeout(slow);if(S.dbState==="slow")S.dbState="ok"}};
  db.collection("weeks").onSnapshot(s=>{S.weeks={};s.docs.forEach(d=>S.weeks[d.id]=d.data());if(!s.metadata.fromCache){S.got.weeks=true;ok()}render()},()=>{S.got.weeks=true;render()});
  db.doc("config/chores").onSnapshot(s=>{S.chores=s.exists?[...(s.data().chores||[])]:[];if(!s.metadata.fromCache){S.got.chores=true;ok()}render()},()=>{S.got.chores=true;render()});
  db.collection("done").where("week","in",WINDOW).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.done=m;S.got.done=true;render()},()=>{});
  db.doc("config/calendar").onSnapshot(s=>{S.calendar=s.exists?{embed:"",events:[],...s.data()}:{embed:"",events:[]};render()},()=>{});
  db.collection("log").orderBy("date","desc").limit(200).onSnapshot(s=>{S.logs=s.docs.map(d=>d.data());if(S.parent)render()},()=>{});
}
render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){
    if(window.FHQ_SEED){db=localDb(window.FHQ_SEED);S.local=true;S.dbState="ok";subscribe();return}
    S.dbState="none";render();return}
  db=await c.use("db");
  if(!db){S.dbState="none";render();return}
  S.dbState="ok";
  try{const user=await c.use("user");if(user&&user.can){const w=await user.can("data.write");if(w===false)S.readOnly=true}}catch(_){}
  subscribe();
})();
})();
</script>
